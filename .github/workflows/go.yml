name: Go

on:
  push:
    branches: [ '*' ]      # Aceita qualquer branch como válida
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:       # Permite rodar o workflow manualmente pela aba Actions

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']       # Testa em mais de uma versão do Go
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}

    - name: Build-DB
      run: docker compose build

    - name: Create-DB
      run: docker compose up --wait -d

    - name: Test
      run: go test -v main_test.go

    - name: Logs do banco
      if: failure()
      run: docker compose ps && docker compose logs postgres

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go

    - name: upload artifact
      uses: actions/upload-artifact@v7
      with:
        # Name of the artifact to upload.
        # Optional. Default is 'artifact'
        name: binario-go

        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        path: main

        # The desired behavior if no files are found using the provided path.
        # Available Options:
        #   warn: Output a warning but do not fail the action
        #   error: Fail the action with an error message
        #   ignore: Do not output any warnings or errors, the action does not fail
        # Optional. Default is 'warn'
        #if-no-files-found:

        # Duration after which artifact will expire in days. 0 means using default retention.
        # Minimum 1 day.
        # Maximum 90 days unless changed from the repository settings page.
        # Optional. Defaults to repository settings.
        retention-days: 2

        # The level of compression for Zlib to be applied to the artifact archive.
        # The value can range from 0 to 9.
        # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
        # Optional. Default is '6'
        #compression-level:

        # If true, an artifact with a matching name will be deleted before a new one is uploaded.
        # If false, the action will fail if an artifact for the given name already exists.
        # Does not fail if the artifact does not exist.
        # Optional. Default is 'false'
        #overwrite:

        # Whether to include hidden files in the provided path in the artifact
        # The file contents of any hidden files in the path should be validated before
        # enabled this to avoid uploading sensitive information.
        # Optional. Default is 'false'
        #include-hidden-files:

        # Whether to zip the artifact files before upload
        # If 'false', only a single file can be uploaded. The name of the file will be used as the artifact name (the 'name' parameter is ignored)
        # Optional. Default is 'true'
        #archive:

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-publish:
    if: github.ref == 'refs/heads/main'
    # De onde vem refs/heads/main
    # Ele vem do próprio Git, e o GitHub Actions só o expõe no **contexto** github.ref.
    # No Git, branches, tags e outros ponteiros são guardados como referências (refs), que são arquivos dentro da pasta .git/refs/. O nome completo de uma ref inclui a pasta onde ela fica:
    #   # O que é: Branch 'main' ==> Nome completo (ref): 'refs/heads/main' ==> Nome curto: 'main'
    #   # O que é: Branch 'Aula_1' ==> Nome completo (ref): 'refs/heads/Aula_1' ==> Nome curto: 'Aula_1'
    #   # O que é: Tag 'v1.0.0' ==> Nome completo (ref): 'refs/tag/v1.0.0' ==> Nome curto: 'v1.0.0'
    #   # O que é: Pull request n5 ==> Nome completo (ref): 'refs/pull/5/merge' ==> Nome curto: '5/merge'
    # No GitHub Actions, Cada execução recebe a ref que a disparou:
    #   # - github.ref guarda o nome completo, como refs/heads/main.
    #   # - github.ref_name guarda o nome curto, como main.
    #   # - github.ref_type diz se é branch ou tag.

    needs: build
    uses: ./.github/workflows/Docker-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write