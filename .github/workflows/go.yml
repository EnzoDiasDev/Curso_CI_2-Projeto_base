name: Go

on:
  push:
    branches: [ '*' ]      # Aceita qualquer branch como válida
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:       # Permite rodar o workflow manualmente pela aba Actions

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']       # Testa em mais de uma versão do Go
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up --wait -d

    - name: Test
      run: go test -v main_test.go 

    - name: Logs do banco
      if: failure()
      run: docker compose ps && docker compose logs postgres
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  
  docker-publish:
    needs: docker
    uses: ./.github/workflows/Docker-publish.yml